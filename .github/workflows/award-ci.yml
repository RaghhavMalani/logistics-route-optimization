name: Award Build CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/portwatch-digital-twin]

jobs:
  intelligence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core dependencies
        run: pip install -r requirements.txt
      - name: Run specialist and ensemble regression tests
        run: python -m unittest tests.test_award_intelligence -v
      - name: Compile award pipeline modules
        run: |
          python -m py_compile run_award_demo.py
          python -m py_compile scripts/live_refresh.py
          python -m py_compile backend/pipeline/export_award_cache.py
          python -m py_compile backend/app/main.py backend/app/routes/health.py

  terminal-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: india-portwatch-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: india-portwatch-terminal/package-lock.json
      - name: Install terminal dependencies
        run: npm ci
      - name: Build terminal
        run: npm run build
