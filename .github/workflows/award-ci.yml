name: India PortWatch CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/portwatch-agentic-maritime-os, feat/portwatch-digital-twin, feat/backend-maintainability, feat/cargo-monte-carlo, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback first. These 218 tests need no artefacts, no network and no
  # pipeline run: the twin, the ledger and the agents are all deterministic and
  # seeded, so the whole operations layer verifies in a few seconds. If the
  # safety boundary is broken, this job says so before anything slow starts.
  operations:
    name: Operations OS (agents, MCP, learning, twin, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-paper.txt

      - name: Compile the operations layer
        run: python -m compileall -q src/portwatch_os tests

      - name: Global Eye - ingest, dedupe, exposure, calibration
        run: python -m unittest tests.test_global_eye -v

      - name: Agents, tool access levels and the MCP protocol
        run: python -m unittest tests.test_agents_and_mcp -v

      - name: Ledger, scoring, reliability and attribution
        run: python -m unittest tests.test_learning_ledger -v

      - name: Port twin, policy benchmark and cargo
        # Small deterministic environments only. The 250-episode training run and
        # the TFT stay out of CI; the suite trains 20-40 episodes on fixed seeds.
        run: python -m unittest tests.test_twin_and_cargo -v

      - name: Reproduce the paper smoke on tuning cases
        timeout-minutes: 2
        run: python scripts/paper_experiments.py --smoke

      - name: Advisory state machine and audit trail
        run: python -m unittest tests.test_advisories -v

      # The server has to start, speak the protocol and withhold EXECUTE. A
      # catalogue that lists an EXECUTE tool at the default ceiling is a safety
      # regression, so the shape of the response is asserted here rather than
      # eyeballed.
      - name: MCP server starts and withholds EXECUTE at the default ceiling
        run: |
          python -m src.portwatch_os.mcp.server --list-tools > mcp_tools.json
          python - <<'PY'
          import json
          tools = json.load(open("mcp_tools.json"))
          levels = {t["access"] for t in tools}
          assert tools, "the MCP catalogue is empty"
          assert "EXECUTE" not in levels, f"EXECUTE exposed at the default ceiling: {levels}"
          assert all(t.get("computedBy") for t in tools), "a tool ships without computed_by"
          print(f"{len(tools)} tools exposed, levels {sorted(levels)}")
          PY

  intelligence:
    name: Intelligence, pipeline and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile every module
        run: |
          python -m compileall -q src backend scripts app run_award_demo.py run_demo.py

      # The pipeline must survive with no network at all: the whole provenance
      # design exists so a degraded run is honest rather than broken. This run
      # also exercises the learning pass, which backfills the ledger from the
      # run's own walk-forward history and puts a candidate policy through the
      # promotion gate.
      - name: Run the pipeline offline end to end
        run: python run_award_demo.py --source sample --model baseline --offline

      - name: Walk-forward benchmark (no deep stack in CI)
        run: |
          python -m src.evaluation.model_benchmark \
            --panel outputs/expert_features/merged_panel.csv \
            --weather outputs/expert_features/weather_features.csv \
            --folds 3 --horizon 5 --no-tft

      - name: Verify the exported artefacts
        run: python scripts/verify_artefacts.py

      # Everything, including the operations suites again -- they are seconds,
      # and running them against a real artefact tree catches an import that
      # only works when nothing has been exported.
      - name: Run the full test suite
        run: python -m scripts.test_suite --timeout=45 --timeout-method=signal --junitxml=backend-junit.xml -ra
      - name: Verify checked-in OpenAPI
        run: python -m scripts.export_openapi --check
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: backend-junit.xml
          retention-days: 7

  terminal:
    name: Terminal typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: india-portwatch-terminal
    steps:
      - uses: actions/checkout@v4
      # Node 24, not 22, because that is the npm the lock file was generated
      # with. npm 10 and npm 11 disagree about optional peer dependencies --
      # unstorage declares lru-cache as an optional peer, npm 11 leaves it out of
      # the lock and npm 10's `npm ci` then refuses the lock as out of sync. The
      # fix is to build on the same major the project is developed and verified
      # on rather than to hand-edit a lock file into satisfying both.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: india-portwatch-terminal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check generated client
        run: npm run api:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  browser:
    # The interface has to be exercised, not just compiled: a screen that
    # renders while throwing a console error, dropping a request or pushing the
    # page sideways at 1366px is broken, and only a browser catches that.
    #
    # The suite also asserts the claims this product makes about itself -- the
    # weather composite on by default, the schematic banner present, an
    # uncalibrated event refusing to show a number, no committed vessel in the
    # action queue, and no agent holding an EXECUTE ceiling.
    name: Browser regression (production build, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Chromium and its system dependencies match @playwright/test in the lockfile.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: india-portwatch-terminal
    steps:
      - uses: actions/checkout@v4
      # Node 24, not 22, because that is the npm the lock file was generated
      # with. npm 10 and npm 11 disagree about optional peer dependencies --
      # unstorage declares lru-cache as an optional peer, npm 11 leaves it out of
      # the lock and npm 10's `npm ci` then refuses the lock as out of sync. The
      # fix is to build on the same major the project is developed and verified
      # on rather than to hand-edit a lock file into satisfying both.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: india-portwatch-terminal/package-lock.json
      - name: Install dependencies
        run: npm ci
      # The suite builds the app itself (node-server preset) and replays a
      # recorded API, so it needs no backend and no network. Route, guard,
      # traffic, routing, agentic and degraded-mode specs all run here.
      #
      # Two viewports in CI: 1920x1080 and 1366x768. The 1440x900 project exists
      # for the local QA pass -- for layout risk 1366 strictly dominates it, so
      # in CI it would add a third of the runtime and no coverage.
      - name: Route, role, traffic, routing, agentic and degraded-mode tests
        run: node qa/run-browser-ci.mjs --without-research --shard=${{ matrix.shard }}/4
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: india-portwatch-terminal/playwright-report
          retention-days: 7

  research-browser:
    name: Browser Research (isolated renderer)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        working-directory: india-portwatch-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: india-portwatch-terminal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Research date, evidence and download contracts at both viewports
        run: node qa/run-browser-ci.mjs --research-only
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-research
          path: india-portwatch-terminal/playwright-report
          retention-days: 7
